# SPDX-License-Identifier: GPL-3.0-or-later
#
# Builds the PS4 package (PLDN10001) on the self-hosted runner that builds Orbis-Win, from the
# same private toolchain cache: an Orbis-Win checkout at the commit its package was built from
# is prepared by Orbis-Win's own scripts/ci/prepare-runner.sh, then scripts/ci/build-package.sh
# extracts that Orbis-Win package, downloads DXVK and the network libraries (pinned hashes)
# and runs scripts/build-ps4-runtime.sh, the workstation build.
name: Build PS4 package

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          APP_VER as NN.NN (e.g. 02.07). Required: a number never used before, always
          increasing, so the console shows which build is installed.
        required: true
      orbis_win_tag:
        description: >-
          Orbis-Win release to build on (e.g. v0.0.5). Empty: the package pinned in the
          runner cache (Orbis-Win 01.62), until a release has run-time title detection.
        default: ""
      publish_release:
        description: >-
          Also publish a GitHub release tagged v<ps4/VERSION> (title: the tag) with the package
          and its manifest. Off: build only. Refuses a version that already has a release.
        type: boolean
        default: false

permissions:
  contents: write   # publish_release creates a release; otherwise only read

concurrency:
  group: playden-ps4-package
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'plastikman/playden-ps4'
    runs-on: playden-ps4-build
    timeout-minutes: 180
    env:
      ORBIS_WIN_CACHED_PKG: /orbis-cache/deps/playden/orbis-win-01.62
    steps:
      - uses: actions/checkout@v4
        with:
          path: playden

      # Only the submodules the PS4 build reads: the UI library and the Prospero profile code.
      - name: Check out the PS4 build's submodules
        run: git -C playden submodule update --init --depth 1 third_party/ps5-homebrew-ui third_party/prospero-win

      - name: Install build tools
        run: |
          # The same LLVM point release as Orbis-Win's CI and the build workstation (Debian
          # 19.1.7): Orbis-Win's prepare-runner.sh routes the cached SDK's tools to LLVM 19.
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo tee /etc/apt/keyrings/apt.llvm.org.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" |
            sudo tee /etc/apt/sources.list.d/llvm-19.list >/dev/null
          printf 'Package: *\nPin: release o=apt.llvm.org\nPin-Priority: 1001\n' |
            sudo tee /etc/apt/preferences.d/llvm-19 >/dev/null
          sudo apt-get update
          # libx11-6/libxext6: the host Wine that makes the prefix template loads its X11 driver.
          sudo apt-get install -y \
            build-essential clang-19 lld-19 llvm-19 cmake ninja-build git python3 curl perl \
            xz-utils bzip2 gh libx11-6 libxext6
          for tool in clang clang++ lld ld.lld llvm-ar llvm-ranlib llvm-nm \
                      llvm-objcopy llvm-readelf llvm-strip; do
            sudo ln -sfn "/usr/bin/${tool}-19" "/usr/local/bin/$tool"
          done
          clang --version | grep -q 'version 19\.1\.7' || {
            echo "clang must be 19.1.7 to match the validated workstation build" >&2; exit 1; }

      - name: Resolve the version and the Orbis-Win package
        id: orbis
        env:
          INPUT_VERSION: ${{ inputs.version }}
          ORBIS_WIN_TAG: ${{ inputs.orbis_win_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$INPUT_VERSION" =~ ^[0-9]{2}\.[0-9]{2}$ ]] || {
            echo "package version '$INPUT_VERSION' must be NN.NN, e.g. 02.07" >&2; exit 1; }
          echo "PKG_VERSION=$INPUT_VERSION" >> "$GITHUB_ENV"
          if [[ -n "$ORBIS_WIN_TAG" ]]; then
            dir="$RUNNER_TEMP/orbis-win-manifest"
            gh release download "$ORBIS_WIN_TAG" -R plastikman/orbis-win -D "$dir" -p 'BUILD-MANIFEST*.txt'
            manifest=$(ls "$dir"/BUILD-MANIFEST*.txt)
            echo "ORBIS_WIN_TAG=$ORBIS_WIN_TAG" >> "$GITHUB_ENV"
          else
            manifest=$(ls "$ORBIS_WIN_CACHED_PKG"/BUILD-MANIFEST*.txt)
            echo "ORBIS_WIN_PKG_DIR=$ORBIS_WIN_CACHED_PKG" >> "$GITHUB_ENV"
          fi
          root_commit=$(sed -n 's/^root_commit=//p' "$manifest")
          [[ "$root_commit" =~ ^[0-9a-f]{40}$ ]] || { echo "no root_commit in $manifest" >&2; exit 1; }
          echo "root_commit=$root_commit" >> "$GITHUB_OUTPUT"
          echo "Orbis-Win package from ${ORBIS_WIN_TAG:-$ORBIS_WIN_CACHED_PKG}, built from $root_commit"

      - uses: actions/checkout@v4
        with:
          repository: plastikman/orbis-win
          ref: ${{ steps.orbis.outputs.root_commit }}
          path: orbis-win

      # Links the cached SDK, toolchain, host Wine and PRX stubs into the Orbis-Win checkout (and
      # the absolute paths its build files and the package manifest's host_wine name).
      - name: Attach the private build cache
        run: |
          set -euo pipefail
          orbis-win/scripts/ci/prepare-runner.sh
          orbis-win/scripts/sync-toolchain.sh

      - name: Build PLDN10001
        env:
          GH_TOKEN: ${{ github.token }}   # prepare-orbis-win.sh downloads the Orbis-Win release
          ORBIS_WIN_ROOT: ${{ github.workspace }}/orbis-win
          PS4_PKGTOOL_OPENSSL_LIB: /orbis-cache/deps/openssl11/lib
          PLAYDEN_HOST_WINE_ROOT: /home/zpeirce/codex_scratch/abi4-upstream-port-20261104/source/.deps/wine-host
          OUT: ${{ runner.temp }}/playden-artifacts
          JOBS: "4"
        run: |
          set -euo pipefail
          playden/scripts/ci/build-package.sh
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "ref=${GITHUB_REF}"
          } >> "$OUT/BUILD-MANIFEST.txt"

      - name: Publish the release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ runner.temp }}/playden-artifacts
          APP_VER: ${{ inputs.version }}
          ORBIS_WIN_TAG: ${{ inputs.orbis_win_tag }}
        run: |
          set -euo pipefail
          # The upstream fork already owns v0.x tags; Playden PS4 releases use ps4-v<version>.
          tag="ps4-v$(head -n1 playden/ps4/VERSION)"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag already has a release; raise ps4/VERSION first" >&2; exit 1
          fi
          pkg=("$OUT"/IV0000-PLDN10001_00-PLDN100010000000.pkg)
          [[ -f "${pkg[0]}" ]] || { echo "no IV0000-PLDN10001_00-PLDN100010000000.pkg in $OUT" >&2; exit 1; }
          cp "$OUT/BUILD-MANIFEST.txt" "$OUT/BUILD-MANIFEST-$APP_VER.txt"
          notes="Playden for PS4 package $APP_VER on Orbis-Win ${ORBIS_WIN_TAG:-01.62 (runner cache)}. Install with GoldHEN's package installer; Settings > Playden update finds later releases."
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --notes "$notes" \
            "${pkg[0]}" "$OUT/BUILD-MANIFEST-$APP_VER.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: playden-ps4-${{ inputs.version }}-${{ github.run_number }}
          path: ${{ runner.temp }}/playden-artifacts/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
