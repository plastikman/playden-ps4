# SPDX-License-Identifier: GPL-3.0-or-later
#
# Builds the PS4 package (PLDN10001) on the self-hosted runner that builds Orbis-Win, from the
# same private toolchain cache: an Orbis-Win checkout at the commit its package was built from
# is prepared by Orbis-Win's own scripts/ci/prepare-runner.sh, then scripts/ci/build-package.sh
# extracts that Orbis-Win package, downloads DXVK and the network libraries (pinned hashes)
# and runs scripts/build-ps4-runtime.sh, the workstation build.
name: Build PS4 package

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          APP_VER as NN.NN (e.g. 02.07). Required: a number never used before, always
          increasing, so the console shows which build is installed.
        required: true
        default: "03.00"
      orbis_win_tag:
        description: >-
          Orbis-Win release to build on. Playden 0.4.1 uses the tested v0.0.8 runtime package.
        default: "v0.0.8"
      publish_release:
        description: >-
          Also publish a GitHub release tagged v<ps4/VERSION> (title: the tag) with the package
          and its manifest. Off: build only. Refuses a version that already has a release.
        type: boolean
        default: false

permissions:
  contents: write   # publish_release creates a release; otherwise only read

concurrency:
  group: playden-ps4-package
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'plastikman/playden-ps4'
    runs-on: playden-ps4-build
    timeout-minutes: 180
    env:
      ORBIS_WIN_CACHED_PKG: /orbis-cache/deps/playden/orbis-win-01.62
    steps:
      - uses: actions/checkout@v4
        with:
          path: playden

      # Only the submodules the PS4 build reads: the UI library and the Prospero profile code.
      - name: Check out the PS4 build's submodules
        run: git -C playden submodule update --init --depth 1 third_party/ps5-homebrew-ui third_party/prospero-win

      - name: Install build tools
        run: |
          # The same LLVM point release as Orbis-Win's CI and the build workstation (Debian
          # 19.1.7): Orbis-Win's prepare-runner.sh routes the cached SDK's tools to LLVM 19.
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo tee /etc/apt/keyrings/apt.llvm.org.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" |
            sudo tee /etc/apt/sources.list.d/llvm-19.list >/dev/null
          printf 'Package: *\nPin: release o=apt.llvm.org\nPin-Priority: 1001\n' |
            sudo tee /etc/apt/preferences.d/llvm-19 >/dev/null
          sudo apt-get update
          # libx11-6/libxext6: the host Wine that makes the prefix template loads its X11 driver.
          sudo apt-get install -y \
            build-essential clang-19 lld-19 llvm-19 cmake ninja-build git python3 curl perl \
            xz-utils bzip2 zstd 7zip gh libx11-6 libxext6
          for tool in clang clang++ lld ld.lld llvm-ar llvm-ranlib llvm-nm \
                      llvm-objcopy llvm-readelf llvm-strip; do
            sudo ln -sfn "/usr/bin/${tool}-19" "/usr/local/bin/$tool"
          done
          clang --version | grep -q 'version 19\.1\.7' || {
            echo "clang must be 19.1.7 to match the validated workstation build" >&2; exit 1; }

      - name: Download and verify runtime-kit payloads
        env:
          PAYLOAD_DIR: ${{ runner.temp }}/runtime-kit-payloads
        run: |
          set -euo pipefail
          mkdir -p "$PAYLOAD_DIR/wine-mono-11.3.0"
          curl --fail --location --proto '=https' --tlsv1.2 -sS \
            -o "$PAYLOAD_DIR/wine-mono-11.3.0-x86.msi" \
            https://dl.winehq.org/wine/wine-mono/11.3.0/wine-mono-11.3.0-x86.msi
          echo 'df2dfc1665c2511882e7cabd56eafd0c0a3d94e5a7e86f969277f6c189d418d3  '"$PAYLOAD_DIR/wine-mono-11.3.0-x86.msi" | sha256sum --check
          7z x -y "$PAYLOAD_DIR/wine-mono-11.3.0-x86.msi" \
            "-o$PAYLOAD_DIR/wine-mono-11.3.0" > "$PAYLOAD_DIR/wine-mono-extract.log"
          curl --fail --location --proto '=https' --tlsv1.2 -sS \
            -o "$PAYLOAD_DIR/vkd3d-proton-3.1.tar.zst" \
            https://github.com/HansKristian-Work/vkd3d-proton/releases/download/v3.1/vkd3d-proton-3.1.tar.zst
          echo 'b85ea8219b71093a3924913dd7aae6172333dc0c069983ed510816d67f02120b  '"$PAYLOAD_DIR/vkd3d-proton-3.1.tar.zst" | sha256sum --check
          tar --zstd -xf "$PAYLOAD_DIR/vkd3d-proton-3.1.tar.zst" -C "$PAYLOAD_DIR"

      - name: Resolve the version and the Orbis-Win package
        id: orbis
        env:
          INPUT_VERSION: ${{ inputs.version }}
          ORBIS_WIN_TAG: ${{ inputs.orbis_win_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$INPUT_VERSION" =~ ^[0-9]{2}\.[0-9]{2}$ ]] || {
            echo "package version '$INPUT_VERSION' must be NN.NN, e.g. 02.07" >&2; exit 1; }
          echo "PKG_VERSION=$INPUT_VERSION" >> "$GITHUB_ENV"
          if [[ "$ORBIS_WIN_TAG" == "v0.0.8" ]]; then
            lock="playden/scripts/ci/orbis-win-v0.0.8.lock"
            dir="$RUNNER_TEMP/orbis-win-package"
            mkdir -p "$dir"
            package=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["package"])' "$lock")
            gh release download "$ORBIS_WIN_TAG" -R plastikman/orbis-win -D "$dir" -p "$package"
            root_commit=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["root_commit"])' "$lock")
            echo "ORBIS_WIN_PKG_DIR=$dir" >> "$GITHUB_ENV"
            echo "ORBIS_WIN_PACKAGE_LOCK=$GITHUB_WORKSPACE/$lock" >> "$GITHUB_ENV"
            echo "ORBIS_WIN_RUNTIME_REVISION=$ORBIS_WIN_TAG" >> "$GITHUB_ENV"
            echo "ORBIS_WIN_PACKAGE_TAG=$ORBIS_WIN_TAG" >> "$GITHUB_ENV"
          elif [[ -n "$ORBIS_WIN_TAG" ]]; then
            dir="$RUNNER_TEMP/orbis-win-manifest"
            gh release download "$ORBIS_WIN_TAG" -R plastikman/orbis-win -D "$dir" -p 'BUILD-MANIFEST*.txt'
            manifest=$(ls "$dir"/BUILD-MANIFEST*.txt)
            root_commit=$(sed -n 's/^root_commit=//p' "$manifest")
            echo "ORBIS_WIN_TAG=$ORBIS_WIN_TAG" >> "$GITHUB_ENV"
          else
            manifest=$(ls "$ORBIS_WIN_CACHED_PKG"/BUILD-MANIFEST*.txt)
            root_commit=$(sed -n 's/^root_commit=//p' "$manifest")
            echo "ORBIS_WIN_PKG_DIR=$ORBIS_WIN_CACHED_PKG" >> "$GITHUB_ENV"
          fi
          [[ "$root_commit" =~ ^[0-9a-f]{40}$ ]] || { echo "no root_commit for Orbis-Win $ORBIS_WIN_TAG" >&2; exit 1; }
          echo "root_commit=$root_commit" >> "$GITHUB_OUTPUT"
          echo "Orbis-Win package from ${ORBIS_WIN_TAG:-$ORBIS_WIN_CACHED_PKG}, built from $root_commit"

      - uses: actions/checkout@v4
        with:
          repository: plastikman/orbis-win
          ref: ${{ steps.orbis.outputs.root_commit }}
          path: orbis-win

      # Links the cached SDK, toolchain, host Wine and PRX stubs into the Orbis-Win checkout (and
      # the absolute paths its build files and the package manifest's host_wine name).
      - name: Attach the private build cache
        run: |
          set -euo pipefail
          orbis-win/scripts/ci/prepare-runner.sh
          orbis-win/scripts/sync-toolchain.sh

      - name: Build PLDN10001
        env:
          GH_TOKEN: ${{ github.token }}   # prepare-orbis-win.sh downloads the Orbis-Win release
          ORBIS_WIN_ROOT: ${{ github.workspace }}/orbis-win
          PS4_PKGTOOL_OPENSSL_LIB: /orbis-cache/deps/openssl11/lib
          PLAYDEN_MESA_COMMIT: 0ec293c29f9735ee462eff0d9a9316481d741afa
          PLAYDEN_HOST_WINE_ROOT: /home/zpeirce/codex_scratch/abi4-upstream-port-20261104/source/.deps/wine-host
          WINE_MONO_DIR: ${{ runner.temp }}/runtime-kit-payloads/wine-mono-11.3.0
          WINE_MONO_VERSION: "11.3.0"
          WINE_MONO_TREE_SHA256: 7aee0067e7aa6a43743e0b0da647d7ab6c892c7dbd288ed76f9763fc92efbaa1
          VKD3D_PROTON_DIR: ${{ runner.temp }}/runtime-kit-payloads/vkd3d-proton-3.1
          VKD3D_PROTON_VERSION: "3.1"
          VKD3D_PROTON_TREE_SHA256: e27aac172c62f3599ebc56f333d70ffd250b555aa0beaeb77ad81901206448c3
          VKD3D_PROTON_QUALIFIED: "0"
          OUT: ${{ runner.temp }}/playden-artifacts
          JOBS: "4"
        run: |
          set -euo pipefail
          playden/scripts/ci/build-package.sh
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "ref=${GITHUB_REF}"
          } >> "$OUT/BUILD-MANIFEST.txt"

      - name: Publish the release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ runner.temp }}/playden-artifacts
          APP_VER: ${{ inputs.version }}
          ORBIS_WIN_TAG: ${{ inputs.orbis_win_tag }}
        run: |
          set -euo pipefail
          # The upstream fork already owns v0.x tags; Playden PS4 releases use ps4-v<version>.
          tag="ps4-v$(head -n1 playden/ps4/VERSION)"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag already has a release; raise ps4/VERSION first" >&2; exit 1
          fi
          pkg=("$OUT"/IV0000-PLDN10001_00-PLDN100010000000.pkg)
          [[ -f "${pkg[0]}" ]] || { echo "no IV0000-PLDN10001_00-PLDN100010000000.pkg in $OUT" >&2; exit 1; }
          cp "$OUT/BUILD-MANIFEST.txt" "$OUT/BUILD-MANIFEST-$APP_VER.txt"
          package_sha=$(sed -n 's/^package_sha256=//p' "$OUT/BUILD-MANIFEST.txt")
          cat > "$OUT/RELEASE-NOTES.md" <<EOF
          ## What's new in Playden for PS4 v0.4.1

          - **Game test reports require an explicit endpoint.** Reporting is off unless \`/data/PLDN10001/features.txt\` contains \`game-test-reports=https://your-report-api\`. Reports are sent only to that endpoint; there is no default destination.
          - **Import games is available behind a feature flag.** Add \`import-games\` to \`/data/PLDN10001/features.txt\` to show the local import workflow.
          - **Updated Orbis-Win runtime:** uses the tested v0.0.8 package (runtime build 02.98), including the PS4 Vulkan shared-resource fix, 32-bit executable-page fix, and updated profile handling.
          - **Runtime-kit capability parity:** includes the profile and recipe updates for environment variables, audio volume, Steam library paths, controller input, Zink, and the runtime-kit view. Prosper-Win is pinned to published commit eaccec6d.
          - **Complete runtime-kit payloads:** restores Wine Mono 11.3.0 and vkd3d-proton 3.1 in the kit. Wine Mono is not yet hardware-qualified with a .NET Framework game, and vkd3d-proton remains unqualified for D3D12 gameplay.
          - **Touchpad launcher input:** the PS4 touchpad provides pointer movement and click input for launcher configuration screens.
          - **Safer game-test reporting and local imports:** reporting requires an explicit endpoint in `/data/PLDN10001/features.txt`; local game import remains behind its feature flag.
          - **Experimental Steam Online play:** Steam sign-in handoff, friends, lobby invites and online game settings. Online play remains off unless \`online-steam\` is listed in \`features.txt\`. Local-network sessions have been tested; internet peer-to-peer play is still experimental and has not been validated on-console. See the [online play notes](https://github.com/plastikman/playden-ps4/blob/ps4-v0.3.1/docs/online-play.md).

          ### Known issues

          Some titles still fail or stall under the PS4 runtime. In the Orbis-Win 02.98 console suite, Hollow Knight and Risk of Rain 2 render but stall during startup; Left 4 Dead 2 and Splinter Cell: Conviction remain on the loading spinner; The Binding of Isaac exits before its first rendered frame; and MDK has visual corruption. See the [Orbis-Win v0.0.8 notes](https://github.com/plastikman/orbis-win/releases/tag/v0.0.8) for the full test record.

          This package is **$APP_VER**, built with Orbis-Win **${ORBIS_WIN_TAG}**.

          ### Installer

          \`IV0000-PLDN10001_00-PLDN100010000000.pkg\`

          SHA-256: \`$package_sha\`
          EOF
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --notes-file "$OUT/RELEASE-NOTES.md" \
            "${pkg[0]}" "$OUT/BUILD-MANIFEST-$APP_VER.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: playden-ps4-${{ inputs.version }}-${{ github.run_number }}
          path: ${{ runner.temp }}/playden-artifacts/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
